[package]
name = "fpl-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
data-encoding = "2.9.0"
env_logger = "0.11.8"
getrandom = "0.3.4"
log = "0.4.28"
regex = "1.12.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.0", features = ["v4"] }
