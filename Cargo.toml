[package]
name = "fpl-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
data-encoding = "2.9.0"
getrandom = "0.3.4"
regex = "1.12.2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.0", features = ["v4"] }
